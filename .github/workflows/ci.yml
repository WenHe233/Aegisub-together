name: Meson CI

on:
  push:
    branches:
      - master
      - feature
      - feat/collaboration
      - cibuilds
  pull_request:
    branches:
      - master
      - feature
      - feat/collaboration
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows MSVC Release
            os: windows-latest
            msvc: true
            buildtype: release
            args: >-
              -Ddefault_library=static 
              --force-fallback-for=zlib,harfbuzz,freetype2,fribidi,libpng 
              -Dfreetype2:harfbuzz=disabled 
              -Dharfbuzz:freetype=disabled 
              -Dharfbuzz:cairo=disabled 
              -Dharfbuzz:glib=disabled 
              -Dharfbuzz:gobject=disabled
              -Dharfbuzz:tests=disabled
              -Dharfbuzz:docs=disabled
              -Dharfbuzz:icu=disabled
              -Dfribidi:tests=false
              -Dfribidi:docs=false
              -Dlibass:fontconfig=disabled
              -Dffmpeg:libdav1d=enabled
              -Davisynth=enabled
              -Dbestsource=enabled
              -Dvapoursynth=enabled
          - name: Windows MSVC Release (wx master)
            os: windows-latest
            msvc: true
            buildtype: release
            args: >-
              -Ddefault_library=static 
              --force-fallback-for=zlib,harfbuzz,freetype2,fribidi,libpng 
              -Dfreetype2:harfbuzz=disabled 
              -Dharfbuzz:freetype=disabled 
              -Dharfbuzz:cairo=disabled 
              -Dharfbuzz:glib=disabled 
              -Dharfbuzz:gobject=disabled
              -Dharfbuzz:tests=disabled
              -Dharfbuzz:docs=disabled
              -Dharfbuzz:icu=disabled
              -Dfribidi:tests=false
              -Dfribidi:docs=false
              -Dlibass:fontconfig=disabled
              -Dffmpeg:libdav1d=enabled
              -Davisynth=enabled
              -Dbestsource=enabled
              -Dvapoursynth=enabled
              -Dwx_version='3.3.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Configure source mirrors
        run: >-
          git config --global
          url."https://github.com/sekrit-twc/libp2p.git".insteadOf
          "https://bitbucket.org/the-sekrit-twc/libp2p.git"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Meson
        run: |
          python -m pip install --upgrade pip setuptools
          pip install meson==1.11.2

      - name: Setup MSVC
        if: matrix.config.os == 'windows-latest' && matrix.config.msvc == true
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Windows)
        if: matrix.config.os == 'windows-latest'
        run: |
          choco install ninja innosetup

          $moonscripturl = "https://github.com/leafo/moonscript/releases/download/win32-v0.5.0/moonscript-187bac54ee5a7450013e9c38e005a0e671b76f45.zip"
          mkdir moonscript
          Invoke-WebRequest -Uri $moonscripturl -OutFile ".\moonscript\moonscript.zip"
          pushd moonscript
          7z e moonscript.zip
          Get-Location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          popd

          $gettexturl = "https://github.com/mlocati/gettext-iconv-windows/releases/download/v0.21-v1.16/gettext0.21-iconv1.16-static-64.zip"
          Invoke-WebRequest -Uri $gettexturl -OutFile ".\gettext.zip"
          Expand-Archive ".\gettext.zip" -DestinationPath gettext
          pushd gettext/bin
          Get-Location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          popd

      - name: Configure
        run: |
          meson setup build ${{ matrix.config.args }} -Dbuildtype=${{ matrix.config.buildtype }}
          meson configure build

      - name: Build
        run: meson compile -C build

      - name: Verify Aegisub Together Windows identity
        if: matrix.config.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath build/aegisub-together.exe
          if (Test-Path -LiteralPath build/aegisub.exe) { throw 'legacy aegisub.exe was produced' }
          if ($exe.VersionInfo.ProductName -ne 'Aegisub Together') { throw "unexpected product name: $($exe.VersionInfo.ProductName)" }
          if ($exe.VersionInfo.OriginalFilename -ne 'aegisub-together.exe') { throw "unexpected original filename: $($exe.VersionInfo.OriginalFilename)" }
      
      - name: Run test
        run: meson test -C build --verbose "gtest main"

      - uses: actions/setup-go@v6
        if: matrix.config.name == 'Windows MSVC Release'
        with:
          go-version: 1.26.5

      - name: Run Windows collaboration transport smoke test
        if: matrix.config.name == 'Windows MSVC Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serverExe = Join-Path $env:RUNNER_TEMP 'aegisub-together-server.exe'
          Push-Location server
          go build -o $serverExe ./cmd/aegisub-together-server
          Pop-Location

          $accessPassword = 'transport-access-pass'
          $roomPassword = 'transport-room-pass'
          $accessHash = $accessPassword | & $serverExe hash-password
          if ($LASTEXITCODE -ne 0) { throw 'Could not hash the transport smoke access password.' }

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $database = Join-Path $env:RUNNER_TEMP 'transport-smoke.db'
          $stdout = Join-Path $env:RUNNER_TEMP 'transport-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'transport-smoke.stderr.log'
          $env:AEGISUB_COLLAB_ACCESS_PASSWORD_HASH = $accessHash.Trim()
          $env:AEGISUB_COLLAB_DATABASE = $database
          $server = Start-Process -FilePath $serverExe -ArgumentList @('serve', '-listen', "127.0.0.1:$port") `
            -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/healthz" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              }
              catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $healthy) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'Temporary collaboration server did not become healthy.'
            }

            $env:AEGISUB_COLLAB_SMOKE_URL = "ws://127.0.0.1:$port/v1/ws"
            $env:AEGISUB_COLLAB_SMOKE_ACCESS_PASSWORD = $accessPassword
            $env:AEGISUB_COLLAB_SMOKE_ROOM_PASSWORD = $roomPassword
            & .\build\tests\gtest-main.exe `
              --gtest_filter=collaboration_transport.DISABLED_live_websocket_smoke `
              --gtest_also_run_disabled_tests
            if ($LASTEXITCODE -ne 0) { throw 'Windows collaboration transport smoke test failed.' }
          }
          finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      # Windows artifacts
      - name: Generate Windows installer
        if: matrix.config.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          meson compile win-installer -C build

      - name: Generate Windows portable installer
        if: matrix.config.os == 'windows-latest'
        run: cd build && ninja win-portable

      - name: Upload artifacts - win_installer
        uses: actions/upload-artifact@v4
        if: matrix.config.os == 'windows-latest'
        with:
          name: ${{ matrix.config.name }} - installer
          path: build/Aegisub-Together-*.exe
          if-no-files-found: error
      
      - name: Upload artifacts - portable.zip
        uses: actions/upload-artifact@v4
        if: matrix.config.os == 'windows-latest'
        with:
          name: ${{ matrix.config.name }} - portable
          path: build/aegisub-together-portable-64.zip
