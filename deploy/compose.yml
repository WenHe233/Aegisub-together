name: aegisub-together

services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/wenhe233/aegisub-together-server:latest}
    restart: unless-stopped
    command: ["serve", "-listen", ":8080", "-database", "/data/collab.db", "-archive-days", "${ARCHIVE_DAYS:-0}"]
    env_file:
      - server.env
    environment:
      AEGISUB_COLLAB_TRUSTED_PROXY_CIDRS: 172.28.0.2/32
    volumes:
      - collab-data:/data
    networks:
      backend:
        ipv4_address: 172.28.0.3
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      COLLAB_DOMAIN: ${COLLAB_DOMAIN:?set COLLAB_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      frontend:
      backend:
        ipv4_address: 172.28.0.2
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      options:
        max-size: 10m
        max-file: "5"

networks:
  frontend:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  collab-data:
  caddy-data:
  caddy-config:
